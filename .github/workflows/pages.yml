name: Verify and deploy the separate FPV archive
on:
  push:
    branches: [main, codex/fpv-archive-migration-20261001]
  pull_request:
permissions:
  contents: read
concurrency:
  group: fpv-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  copy-audio:
    timeout-minutes: 30
    if: github.event_name == 'push' && github.repository == 'mekhovov/revealline-soundtracks-fpv'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: node --test test-*.mjs
      - name: Copy and verify exact existing MP3 assets on the hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: node intake/migration-copy.mjs
      - name: Promote exact reviewed audio volumes after main merge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node intake/publish-volumes.mjs
  verify:
    timeout-minutes: 30
    needs: copy-audio
    if: always() && (needs.copy-audio.result == 'success' || needs.copy-audio.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: |
          node --test test-*.mjs
          node verify.mjs
          node intake/verify-external.mjs
          git diff --check
      - name: Stage and hash-check the complete destination audio
        run: node verify.mjs --stage public
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public
  deploy:
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mekhovov/revealline-soundtracks-fpv'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the independently verified FPV Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
  public-acceptance:
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mekhovov/revealline-soundtracks-fpv'
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Verify every public migrated object without storing audio
        run: node intake/verify-public.mjs > fpv-public-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: fpv-public-verification
          path: fpv-public-verification.json
